name: Build review corpus (manual)

# Manual diagnostics only: fetches every watch's searches once (3s apart) from a GitHub
# runner and uploads the raw results as an artifact, so matching rules can be validated
# offline against real titles. Never alerts, never touches seen.db.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N searches (0 = all)"
        default: "0"
      raw:
        description: "Also save raw HTML of the first N searches"
        default: "0"
      ab:
        description: "Instead: A/B requests vs curl_cffi on N searches (0 = off)"
        default: "0"
      ab_mode:
        description: "A/B experiment: client (requests vs curl_cffi) or retry (403 retry policies)"
        default: "client"

permissions:
  contents: read

concurrency:
  group: ebay-corpus
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch every watch's searches once
        if: ${{ inputs.ab == '0' }}
        env:
          CORPUS_LIMIT: ${{ inputs.limit }}
          CORPUS_RAW: ${{ inputs.raw }}
        run: python tools/corpus.py corpus.json

      - name: A/B the HTTP client (requests vs curl_cffi)
        if: ${{ inputs.ab != '0' }}
        env:
          AB_N: ${{ inputs.ab }}
          AB_MODE: ${{ inputs.ab_mode }}
        run: |
          pip install "curl_cffi>=0.7,<1"
          python tools/http_ab.py ab.json

      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: |
            corpus.json
            ab.json
            raw/
          if-no-files-found: ignore
          retention-days: 7
