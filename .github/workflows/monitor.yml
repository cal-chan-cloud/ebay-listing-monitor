name: eBay Listing Monitor

# GitHub throttles scheduled cron hard (fires land every ~2-7 h, not the 5 min
# requested). So instead of one pass per trigger, each job LOOPS internally in two
# ~105-min segments (seen.db is committed after each) and, when it finishes normally,
# QUEUES ITS OWN SUCCESSOR, so coverage is continuous instead of waiting hours for the
# next cron fire (measured before: monitor idle ~20% of the time, gaps up to 6 h). The
# cron stays as a backup (a cancelled or crashed job does not requeue). A config/code
# push is picked up at the next segment boundary. (Scans are throttled to a smooth,
# browser-like request rate that backs off by itself when eBay pushes back; see
# min_request_interval_seconds / poll_interval_seconds / priority_interval_seconds.)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allows a manual "Run workflow" button

# Never run two passes at once (protects the committed seen.db state).
concurrency:
  group: ebay-monitor
  cancel-in-progress: false

permissions:
  contents: write         # to commit the updated seen.db back
  actions: write          # to requeue itself on a fresh runner (see "Requeue" below)

jobs:
  scan:
    # Pinned (not ubuntu-latest, which moves to Ubuntu 26.04 from 2026-10-19): the stateful
    # monitor shouldn't change OS under it unannounced.
    runs-on: ubuntu-24.04
    # Safety cap. The steps' own caps add up to ~295 min (2 x 120 + persists + queue steps); the
    # 2 x 105-min segments self-exit (~213 min + setup). The watchdog's TIMEOUT_MINUTES matches.
    timeout-minutes: 300
    steps:
      # Check out the CURRENT tip of main, not the schedule-fire-time commit. GitHub
      # pins `schedule` runs to github.sha (main's HEAD when the cron fired); with 50-min
      # runs queued back-to-back, a freshly pushed commit then takes 1-2 cycles (~1-2h)
      # to actually run. `ref: main` fetches main's latest tip at job-start instead, so
      # every run executes the newest code AND starts from the newest committed seen.db
      # (main's tip is always the latest "chore: update seen listings" commit).
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --reroll-exit: eBay localizes results by the runner's IP, and GitHub sometimes
      # places the runner outside the US (e.g. Azure mexicocentral), where every watch
      # then matches nothing. The monitor checks its egress country first (and watches for
      # consecutive broken scans) and exits 75 instead of scanning blind; this job then
      # requeues itself so the next run lands on a different runner.
      # PYTHONUNBUFFERED: lines reach the job log as they're printed (piped stdout is
      # block-buffered: pass summaries showed up ~20 min late, and a cancel lost them).
      # timeout-minutes: a hung request can't hold the job; persist still runs (always()).
      - name: Run monitor (segment 1, ~105 min)
        id: seg1
        timeout-minutes: 120
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          rc=0; python ebay_monitor.py --loop-for-minutes 105 --reroll-exit || rc=$?
          if [ "$rc" = 75 ]; then echo "reroll=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$rc"

      - name: Persist seen listings (segment 1)
        # always(): commit whatever seen.db already holds even if the loop errored or
        # the job is being cancelled/timed out, so those alerts aren't re-fired.
        if: always()
        run: bash .github/persist.sh

      # Queue the successor NOW, while segment 2 still scans: it waits in the concurrency
      # group and starts the moment this run ends, and if GitHub's API is down (2026-11-05:
      # HTTP 500/502 on every try for over a minute broke the chain for 2 h) the final step
      # below retries for 20 min after segment 2. Only after a healthy segment 1, so a job that
      # crashes in segment 2 gets at most one successor (whose own crash then ends the chain).
      # (`!cancelled()` overrides the implicit success(): a failed segment-1 persist, e.g. a
      # GitHub git outage, must not drop the chain.)
      - name: Queue the next run (early)
        id: early
        if: ${{ !cancelled() && steps.seg1.outcome == 'success' && steps.seg1.outputs.reroll != '1' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh workflow run monitor.yml --ref main -R "$GITHUB_REPOSITORY"; then
              echo "queued=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 20
          done
          echo "::warning::could not queue the next run yet; retrying after segment 2"

      # Runs only if segment 1 succeeded (a crash/bad config stops here, visibly). A failed
      # segment-1 persist does NOT stop it: seen.db is still on this runner and segment 2's
      # persist commits it 105 min later (skipping segment 2 used to drop the chain AND, if the
      # outage outlasted both persists, the whole job's seen state). If the remote advanced, the
      # persist replayed onto the new tip, so this segment runs the newest pushed code/config.
      - name: Run monitor (segment 2, ~105 min)
        id: seg2
        if: ${{ !cancelled() && steps.seg1.outcome == 'success' && steps.seg1.outputs.reroll != '1' }}
        timeout-minutes: 120
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          pip install -q -r requirements.txt || echo "::warning::pip install failed; continuing"
          rc=0; python ebay_monitor.py --loop-for-minutes 105 --reroll-exit || rc=$?
          if [ "$rc" = 75 ]; then echo "reroll=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$rc"

      - name: Persist seen listings (segment 2)
        if: always()
        run: bash .github/persist.sh

      # A workflow_dispatch made with the job's own token DOES start a new run (the one
      # documented exception to "GITHUB_TOKEN events don't trigger workflows"). It waits in
      # the concurrency group until this job finishes, then starts on a fresh runner.
      # Queued after a reroll (wrong-country / blocked runner) AND after a normal finish,
      # for continuous coverage, unless the early step above already queued one. Never after
      # a cancel or a crash (no tight crash loop; the cron and the watchdog retry later). To
      # STOP the monitor, disable the workflow: a cancel alone lets the queued run start.
      - name: Queue the next run
        if: ${{ !cancelled() && steps.early.outputs.queued != '1' && (steps.seg1.outputs.reroll == '1' || steps.seg2.outputs.reroll == '1' || steps.seg2.outcome == 'success') }}
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |   # an API outage must not break the chain until the next cron fire (hours away)
          deadline=$(( $(date +%s) + 1200 ))
          n=0
          until gh workflow run monitor.yml --ref main -R "$GITHUB_REPOSITORY"; do
            n=$((n + 1))
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::could not queue the next run after $n tries in 20 min"; exit 1
            fi
            sleep $(( n < 6 ? 20 : 60 ))
          done
